[project]
name = "ai-copilot-saas-analytics-backend"
version = "0.1.0"
description = "Backend for SaaS Analytics AI Co-Pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "gunicorn>=22.0.0",
    "psycopg[binary]>=3.1.18",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "anthropic>=0.30.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0,<5.0.0",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "faker>=25.8.0",
    "structlog>=24.2.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.10",
    "black>=24.4.2"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Without an explicit `select`, ruff runs a near-empty default ruleset — it was passing
# CI while checking almost nothing.
#   E/W  pycodestyle      F   pyflakes        I   import sorting
#   B    bugbear          UP  pyupgrade       C4  comprehensions
#   S    bandit (security)    RUF  ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "C4", "S", "RUF"]
ignore = [
    "E501",  # line length is enforced by black
    "B008",  # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use asserts and hardcoded credentials.
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["I001"]
# Synthetic demo data. `random` is the right tool here; nothing generated is a secret.
"app/db/seed.py" = ["S311"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
