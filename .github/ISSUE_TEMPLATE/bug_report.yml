name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, do **not** file here — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as viewer
        2. Ask "..."
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Metric correctness (a wrong number)
        - Agent loop / tool choice
        - Auth or permissions
        - Interface
        - Deployment or configuration
        - Not sure
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: If a number was wrong
      description: >
        Paste the tool trace from under the answer — expand "View data". The metric name
        and arguments are what make this diagnosable.
  - type: input
    id: version
    attributes:
      label: Version or commit
