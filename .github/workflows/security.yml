name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A dependency that was clean at merge time may not be next week.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: ./frontend
        # Fails on high and critical only: a moderate advisory in a dev-only transitive
        # dependency should not block a merge.
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Branch protection on main requires a check named `security`. `Security` is this
  # workflow's *name*, but GitHub matches required contexts against *job* names — so the
  # required check could never report, and no pull request could merge into main at all.
  #
  # This job is that context. It has no steps of its own: it exists to turn "both security
  # jobs succeeded" into a single name the protection rule can require, so adding a third
  # job later does not mean editing repo settings to keep it enforced.
  #
  # `if: always()` with an explicit result check, rather than bare `needs`, because a
  # skipped or cancelled dependency does not run this job at all under the default
  # condition — which GitHub reports as success, and the gate would pass while nothing ran.
  security:
    runs-on: ubuntu-latest
    needs: [dependencies, secrets]
    if: always()
    steps:
      - name: Require both security jobs to have succeeded
        run: |
          echo "dependencies: ${{ needs.dependencies.result }}"
          echo "secrets:      ${{ needs.secrets.result }}"
          if [ "${{ needs.dependencies.result }}" != "success" ] || \
             [ "${{ needs.secrets.result }}" != "success" ]; then
            echo "::error::A security job did not succeed."
            exit 1
          fi
